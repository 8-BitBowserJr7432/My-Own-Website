<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>8-bitbowserjr7432 Zelda</title>

<style>

body{
margin:0;
font-family:Arial,Helvetica,sans-serif;
background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
color:white;
text-align:center;
overflow:hidden;
}

#loader{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:#0a0a0a;
display:flex;
align-items:center;
justify-content:center;
flex-direction:column;
z-index:9999;
}

.spinner{
border:6px solid #333;
border-top:6px solid #ffcc00;
border-radius:50%;
width:60px;
height:60px;
animation:spin 1s linear infinite;
margin-bottom:20px;
}

@keyframes spin{
0%{transform:rotate(0deg)}
100%{transform:rotate(360deg)}
}

.container{
padding-top:120px;
animation:fadein 1.5s ease;
}

@keyframes fadein{
from{opacity:0; transform:translateY(30px)}
to{opacity:1; transform:translateY(0)}
}

h1{
font-size:42px;
margin-bottom:10px;
}

p{
opacity:0.9;
font-size:18px;
}

.buttons{
margin-top:40px;
}

button{
background:#ff0000;
border:none;
padding:15px 28px;
margin:10px;
font-size:18px;
border-radius:10px;
cursor:pointer;
color:white;
transition:0.3s;
}

button:hover{
transform:scale(1.08);
background:#ff2e2e;
box-shadow:0 0 20px rgba(255,0,0,0.6);
}

.lang{
position:fixed;
top:10px;
right:10px;
}

.lang button{
background:#222;
font-size:14px;
padding:8px 14px;
}

footer{
position:fixed;
bottom:10px;
width:100%;
opacity:0.7;
font-size:14px;
}

</style>
</head>

<body>

<div id="loader">
<div class="spinner"></div>
<div id="loadingText">Loading...</div>
</div>

<div class="lang">
<button onclick="setLang('en')">EN</button>
<button onclick="setLang('de')">DE</button>
<button onclick="setLang('sq')">AL</button>
</div>

<div class="container">
<h1 id="title">Welcome</h1>
<p id="desc">A cool YouTube gaming channel</p>

<div class="buttons">
<button onclick="openChannel()">📺 YouTube Channel</button>
<button onclick="subscribe()">⭐ Subscribe</button>
</div>
</div>

<footer id="footer">
Fan page for 8-bitbowserjr7432 Zelda
</footer>

<script>

const translations = {

en:{
title:"Welcome to the Channel",
desc:"Check out awesome gaming videos and Zelda content!",
loading:"Loading website...",
footer:"Fan page for 8-bitbowserjr7432 Zelda"
},

de:{
title:"Willkommen zum Kanal",
desc:"Schau dir großartige Gaming- und Zelda-Videos an!",
loading:"Website wird geladen...",
footer:"Fan-Seite für 8-bitbowserjr7432 Zelda"
},

sq:{
title:"Mirë se vini në kanal",
desc:"Shiko video të mrekullueshme gaming dhe Zelda!",
loading:"Duke ngarkuar faqen...",
footer:"Faqe fansash për 8-bitbowserjr7432 Zelda"
}

};

function getLang(){
const urlParams=new URLSearchParams(window.location.search);
let lang=urlParams.get("lang");

if(!lang){
lang=navigator.language.substring(0,2);
}

if(!translations[lang]) lang="en";

return lang;
}

function applyLang(lang){

document.getElementById("title").innerText=translations[lang].title;
document.getElementById("desc").innerText=translations[lang].desc;
document.getElementById("loadingText").innerText=translations[lang].loading;
document.getElementById("footer").innerText=translations[lang].footer;

}

function setLang(lang){
window.location.search="?lang="+lang;
}

function openChannel(){
window.open("https://www.youtube.com/@8-bitbowserjr7432_zelda","_blank");
}

function subscribe(){
window.open("https://www.youtube.com/@8-bitbowserjr7432_zelda?sub_confirmation=1","_blank");
}

const lang=getLang();
applyLang(lang);

window.onload=function(){
setTimeout(()=>{
document.getElementById("loader").style.display="none";
document.body.style.overflow="auto";
},1500);
}

</script>

</body>
</html>
